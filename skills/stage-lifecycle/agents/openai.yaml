interface:
  display_name: "Stage Lifecycle"
  short_description: "Shared Web/Local Git bootstrap, review checkpoint, finalization, and incomplete-stage retirement"
  default_prompt: "Use $stage-lifecycle from the primary repo root on the GTX 1660 Ti control plane for exactly one operation: bootstrap_plan, checkpoint_review, finalize, or retire_incomplete. Enforce the strict terminal contract: WP0-WP8 completion inventory for terminal plans, DEV-CLOSEOUT SINGLE/verification-only, and only the exact machine-readable Development Complete Record block unlocks validation. Validation bootstrap remains on the 1660 Ti and must not require a local >=22 GiB GPU, 4090 machine record, or target roots; those are checked only by a target-GPU operator-start preflight. After terminal finalize report the exact development_complete_commit, but do not migrate the control plane. A valid INTERRUPTED_ENV checkpoint is resumable through explicit execution-router resume; retire_incomplete is only an explicit abandon path. For checkpoint/finalize, use explicit stage_id when provided, otherwise auto-select only when exactly one active stage worktree exists. Do not implement code, route execution, review code, invoke agents, push, or transfer repositories."
