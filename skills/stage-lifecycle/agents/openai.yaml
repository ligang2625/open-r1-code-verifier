interface:
  display_name: "Stage Lifecycle"
  short_description: "Shared Web/Local Git bootstrap, review checkpoint, finalization, and incomplete-stage retirement"
  default_prompt: "Use $stage-lifecycle from the primary repo root for exactly one operation: bootstrap_plan, checkpoint_review, finalize, or retire_incomplete. The same Git/provenance contract applies in Local Codex and Web GPT + CodexPro; no backend parameter is needed. For checkpoint/finalize, use explicit stage_id when provided, otherwise auto-select only when exactly one active stage worktree exists. For bootstrap, complete all read-only handoff/routing/skill/base preflight before creating a branch/worktree. For checkpoint, enforce append-only review history. retire_incomplete requires explicit stage_id/reason and only archives stages with commits but no completed E0/review. Do not implement code, route execution, review code, invoke agents, or push."
