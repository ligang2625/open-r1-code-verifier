interface:
  display_name: "Stage Lifecycle"
  short_description: "Shared Web/Local Git bootstrap, review checkpoint, finalization, and incomplete-stage retirement"
  default_prompt: "Use $stage-lifecycle from the primary repo root for exactly one operation: bootstrap_plan, checkpoint_review, finalize, or retire_incomplete. Enforce the strict terminal contract: WP0-WP8 completion inventory for terminal plans, DEV-CLOSEOUT SINGLE/verification-only, and only the exact machine-readable Development Complete Record block unlocks validation. Validation bootstrap also requires the current machine to be >=22 GiB 4090-class; after terminal finalize report the exact development_complete_commit for the one-time machine handoff. A valid INTERRUPTED_ENV checkpoint is resumable through explicit execution-router resume; retire_incomplete is only an explicit abandon path, not the mandatory environment-recovery path. For checkpoint/finalize, use explicit stage_id when provided, otherwise auto-select only when exactly one active stage worktree exists. Do not implement code, route execution, review code, invoke agents, push, or transfer repositories."
