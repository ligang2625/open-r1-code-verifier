interface:
  display_name: "Stage Lifecycle"
  short_description: "Shared Web/Local Git bootstrap, review checkpoint, finalization, and incomplete-stage retirement"
  default_prompt: "Use $stage-lifecycle for one lifecycle operation. Treat sealed plan and planning/review/checkpoint SHAs as default provenance anchors, not immutable state locks: if main/stage HEAD advances or ordinary parent hashes differ, inspect whether the changes are attributable and semantically compatible before blocking. User-explicit execution/recovery changes take precedence over the sealed default and should be recorded rather than forcing replan. Partial/incomplete stages should be assessed for continuation first; retire_incomplete is abandon/clearly-unrecoverable only. Keep hard boundaries for correct stage/worktree, no tracked .ai-bridge, no unreviewed material changes at finalization, Development Complete evidence, and real operator target handoff/script/evidence identity. Do not implement, route, review, push, or run target commands."
