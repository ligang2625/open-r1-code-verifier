  short_description: "Shared Web/Local Git bootstrap, review checkpoint, finalization, and incomplete-stage retirement"
  default_prompt: "Use $stage-lifecycle from the GTX 1660 Ti control plane for exactly one lifecycle operation. Validation target_hardware may be GTX 1660 Ti for formal-evidence-only analysis or 24GB GPU for stages with new target-GPU execution; bootstrap itself never requires the 4090. For target=24GB, require an operator block covering every 24GB gate, tracked secret-free run.sh provenance, target-side post-run acceptance, and versioned evidence binding. Environment checkpoints remain report-only; portable operator checkpoint commits may contain only the execution report plus the one tracked operator script. Preserve terminal inventory/Development Complete Record, explicit resume, legacy operator compatibility, and retire_incomplete as abandon-only. Do not implement, route, review, push, transfer, or probe the 4090."
