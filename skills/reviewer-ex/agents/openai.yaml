interface:
  display_name: "Reviewer Ex"
  short_description: "Backend-agnostic provenance review + repair routing"
  default_prompt: "Use $reviewer-ex only in a fresh Web GPT conversation that did not implement the latest execution. Open the correct stage worktree and review the actual current code against an effective contract built from the sealed default plus any explicit user override. Do not fail solely because current HEAD, plan/review/workflow-runtime SHAs, or recovery path differ from old provenance; inspect lineage/diff and include attributable continuation. Keep strict checks only where they prove reality or safety: correct stage identity, independent tests, formal evidence boundaries, actual operator handoff commit, tracked script SHA, received evidence SHA, command/postcheck status, target runtime identity, and required artifact hashes. Do not rerun target-GPU gates; append review/repair routing based on effective findings."
