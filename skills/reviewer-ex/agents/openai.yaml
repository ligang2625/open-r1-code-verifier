interface:
  display_name: "Reviewer Ex"
  short_description: "Backend-agnostic provenance review + repair routing"
  default_prompt: "Use $reviewer-ex only in a fresh Web GPT conversation that did not implement the latest execution. Resolve stage_id explicitly when provided; otherwise auto-select only when exactly one active stage worktree exists. Open that exact worktree, rebuild state from Git/sealed artifacts, and enforce the plan profile: terminal development must pass the full closeout suite; validation must prove real 24GB-class evidence and persistent artifacts outside the worktree. Review with the same standard regardless of backend/effective mode, append review_record and repair_routing, then stop for shared $stage-lifecycle checkpoint_review."
