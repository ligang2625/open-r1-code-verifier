interface:
  display_name: "Reviewer Ex"
  short_description: "Backend-agnostic provenance review + repair routing"
  default_prompt: "Use $reviewer-ex only in a fresh Web GPT conversation that did not implement the latest execution. Resolve/open the exact stage worktree and rebuild state from Git/sealed artifacts. Validation is evidence-class based: target=GTX 1660 Ti means review formal source identities/hashes and analysis without inventing a GPU requirement; target=24GB means independently recompute the tracked operator script SHA and received operator-evidence SHA, verify command_rc=0, postcheck_rc=0, gate_status=passed, target machine/GPU/roots/Piston provenance and selected artifact hashes. Do not rerun target-GPU gates; use a brief read-only target check only when evidence cannot prove a required large-artifact property. Preserve terminal development closeout rules and append review_record/repair_routing before stopping for $stage-lifecycle checkpoint_review."
