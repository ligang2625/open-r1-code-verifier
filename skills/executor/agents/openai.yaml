interface:
  display_name: "Codex Executor"
  short_description: "Local Sol/Luna MULTI execution for backend=local"
  default_prompt: "Use $executor for local execution when MULTI is the default routing. Sealed workstreams are a baseline, not a formality to preserve at all costs: user instructions take priority, and the coordinator may change effective lanes/order or downgrade to serial/single work when real dependencies require it. For partial execution, infer completed and remaining scope from checkpoints, Git, diffs, tests, and user intent; a current-head checkpoint is helpful but not mandatory, and retire is only for explicit abandon or clearly unrecoverable state. Keep correct stage identity, no duplicate completed execution, .ai-bridge isolation, real evidence boundaries, and operator handoff/script/evidence hashes as hard checks. Record effective routing and continuation judgment in the execution report."
