interface:
  display_name: "Execution Router"
  short_description: "State-aware execution routing with runtime local/web backend"
  default_prompt: "Use $execution-router from the primary repo root. Derive exact stage/provenance and plan profile first. For validation, preflight a >=22 GiB visible NVIDIA GPU (24GB-class) and a writable persistent artifact_root outside the stage worktree before dispatch. backend=local is only valid in Local Codex with execution-agent capability; Web GPT + CodexPro must explicitly use backend=web. Web execution continues with executor-web, preserves sealed routing, serializes source MULTI, then stops so reviewer-ex can run in a fresh Web conversation."
