interface:
  display_name: "Execution Router"
  short_description: "State-aware execution routing with runtime local/web backend"
  default_prompt: "Use $execution-router from the primary repo root. Derive exact stage/provenance and plan profile first. Validation stages should already have been planned/bootstraped on the post-handoff 4090; still preflight a >=22 GiB visible NVIDIA GPU and a writable persistent artifact_root outside the stage worktree before every dispatch. backend=local is only valid in Local Codex with execution-agent capability; Web GPT + CodexPro must explicitly use backend=web. A current-head environment interruption checkpoint is resumable: ordinary invocation reports ROUTING_RESUME_AVAILABLE, and only explicit resume consumes it; never force retire for a valid environment checkpoint. Web execution continues with executor-web, preserves sealed routing, serializes source MULTI, then stops so reviewer-ex can run in a fresh Web conversation."
