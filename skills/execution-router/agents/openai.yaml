interface:
  display_name: "Execution Router"
  short_description: "State-aware execution routing with runtime local/web backend"
  default_prompt: "Use $execution-router from the control plane. Treat sealed plan/latest review as the default contract only when the user has not explicitly overridden implementation, scope, ordering, routing, or recovery. Ordinary commit/parent/workflow-runtime SHAs are provenance anchors, not mechanical blockers: use Git/report/tests to judge whether a partial stage can safely continue, and prefer resume/continue unless there is an irreparable or unassignable state. Never duplicate a completed execution. Keep only necessary hard integrity checks: correct stage/worktree, .ai-bridge untracked, actual operator handoff commit, tracked script SHA, received evidence/artifact identity, and real target-GPU/formal-evidence boundaries. Never auto-push or run operator commands."
