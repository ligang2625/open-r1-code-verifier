interface:
  display_name: "Execution Router"
  short_description: "State-aware execution routing with runtime local/web backend"
  default_prompt: "Use $execution-router from the primary repo root. Derive exact stage/provenance and plan profile first. GTX 1660 Ti is the control plane for development and validation orchestration. Determine backend from the actual execution runtime and capabilities, never from target hardware or the control surface: a local Codex CLI/app-server remains backend=local when controlled remotely; only a Web GPT session operating the repo through CodexPro is backend=web. Local MULTI additionally requires execution-agent capability; if missing, report ROUTING_LOCAL_AGENT_CAPABILITY_UNAVAILABLE instead of switching backend. For validation, do not require the control-plane host to expose the 4090, validation-machine record, or target roots before ordinary dispatch. A target-GPU operator gate produces a portable handoff; its user-run script fail-closed checks the 4090 >=22 GiB GPU, target-local persistent roots, exact model/data/cache and the 1660ti-wsl Piston tunnel at target start. Resume and reviewer consume returned evidence on the control plane. Environment interruption checkpoints remain resumable and never force retire. Web execution continues with executor-web, preserves sealed routing, serializes source MULTI, and leaves review to a fresh Web conversation."
