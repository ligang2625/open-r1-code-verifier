interface:
  display_name: "Execution Router"
  short_description: "State-aware execution routing with runtime local/web backend"
  default_prompt: "Use $execution-router from the GTX 1660 Ti control plane and derive exact stage/provenance/profile first. Backend is the actual Web/Local runtime, never target hardware. Validation may target GTX 1660 Ti when it only consumes formal evidence, or 24GB GPU when it performs new target-GPU work. The router never directly dispatches to the 4090: every 24GB gate uses the operator block and a tracked Git-self-contained run.sh. Operator resume must verify tracked script SHA, versioned evidence provenance, command_rc=0, postcheck_rc=0, gate_status=passed, and the received evidence SHA; insufficient large-artifact proof requires a brief read-only target check rather than guessed PASS. Preserve resumable environment checkpoints, legacy operator compatibility, and sealed SINGLE/MULTI routing; never auto-push or run the target script."
