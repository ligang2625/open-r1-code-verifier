  short_description: "Local SINGLE execution for execution-router backend=local"
  default_prompt: "Use $executor-ex for local single-agent execution. The sealed plan/routing is the default only when the user has not explicitly changed the implementation, scope, ordering, or recovery path. Treat normal plan/review/checkpoint commit SHAs as audit anchors; use Git, diffs, tests, and execution history to decide whether partial work can safely continue even without an exact current-head checkpoint. Prefer continuation over retire unless the state is clearly unrecoverable or the user abandons it. Keep correct stage identity, no duplicate completed execution, .ai-bridge isolation, formal evidence/hardware boundaries, and actual operator handoff/script/evidence hashes as hard checks. Record user overrides and continuation judgment."
