interface:
  display_name: "Planner Ex"
  short_description: "Web stage planning + routing handoff; shared lifecycle seals Git state"
  default_prompt: "Use $planner-ex from the primary repo root to produce the next stage's complete function-level plan and execution_routing. Follow development-first scheduling, but mark a stage terminal only when a WP0-WP8 Development Completion Inventory accounts for every development deliverable. DEV-CLOSEOUT is verification-only and valid only when all inventory items are already finalized. After the strict machine-readable completion record exists, validation planning must restart on a >=22 GiB 4090-class machine from the synced exact development_complete_commit; do not publish/bootstrap validation on the 1660 Ti. Do not select an execution backend or mutate Git topology; publish the plan payload for shared $stage-lifecycle bootstrap_plan."
