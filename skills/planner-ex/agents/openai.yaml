interface:
  display_name: "Planner Ex"
  short_description: "Web stage planning + routing handoff; shared lifecycle seals Git state"
  default_prompt: "Use $planner-ex from the primary repo root on the GTX 1660 Ti control plane to produce the next stage's complete function-level plan and execution_routing. Follow development-first scheduling, but mark a stage terminal only when a WP0-WP8 Development Completion Inventory accounts for every development deliverable. DEV-CLOSEOUT is verification-only and valid only when all inventory items are already finalized. After the strict machine-readable completion record exists, validation planning still stays on the 1660 Ti and records control_plane_hardware separately from target_hardware. Do not require the 4090 to be online or live-probe its GPU/roots while planning; target-GPU readiness belongs to the portable operator-start preflight when a real 4090 gate is reached. Do not select an execution backend or mutate Git topology; publish the plan payload for shared $stage-lifecycle bootstrap_plan."
