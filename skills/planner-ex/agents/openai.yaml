interface:
  display_name: "Planner Ex"
  short_description: "Web stage planning + routing handoff; shared lifecycle seals Git state"
  default_prompt: "Use $planner-ex from the primary repo root on the GTX 1660 Ti control plane. Validation is an evidence profile, not automatically a 24GB execution target: formal-evidence-only aggregation/CI/analysis/report stages target the 1660 Ti, while any new target-GPU execution makes target_hardware=24GB GPU. Every 24GB acceptance gate, including short smoke, must use the operator block. The operator contract is Git-self-contained: tracked secret-free run.sh, target-start fail-closed preflight, mandatory post-run acceptance, and versioned evidence whose SHA is bound on resume. Do not live-probe the 4090 while planning, do not select an execution backend, and preserve development-terminal inventory/DEV-CLOSEOUT rules before publishing the plan for $stage-lifecycle bootstrap_plan."
