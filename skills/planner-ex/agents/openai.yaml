interface:
  display_name: "Planner Ex"
  short_description: "Web stage planning + routing handoff; shared lifecycle seals Git state"
  default_prompt: "Use $planner-ex from the primary repo root. Produce a complete default stage contract, but explicitly treat the sealed plan/routing as a baseline that later user instructions may override without requiring a plan rewrite or exact plan-base SHA preservation. Record planning provenance for audit, not as an immutable state lock. Keep true safety/evidence boundaries: correct stage identity, development vs formal validation semantics, and every real 24GB target-GPU gate through the operator boundary with tracked script/evidence identity. Preflight should contain only useful default prerequisites; later executors may skip evidence-covered/outdated items or adapt routing based on current state. Do not select the runtime backend or live-probe the target GPU while planning."
