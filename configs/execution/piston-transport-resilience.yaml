version: 1
safe_retry_kinds:
  - connection_refused
  - preconnect_failure
max_attempts: 3
backoff_seconds:
  - 0.25
  - 1.0
backoff_cap_seconds: 1.0
health_probe:
  listener_host: 127.0.0.1
  listener_port: 2000
  http_path: /api/v2/runtimes
  required_runtime: "3.10.0"
  max_wait_attempts: 7
  backoff_seconds:
    - 0.5
    - 1.0
    - 2.0
    - 4.0
    - 8.0
    - 10.0
  backoff_cap_seconds: 10.0
tunnel_supervisor:
  ssh_target: 1660ti-wsl
  local_host: 127.0.0.1
  local_port: 2000
  remote_host: 127.0.0.1
  remote_port: 2000
  connect_timeout_seconds: 10
  server_alive_interval_seconds: 30
  server_alive_count_max: 3
  reconnect_backoff_seconds:
    - 1.0
    - 2.0
    - 5.0
    - 10.0
  reconnect_backoff_cap_seconds: 10.0
  max_reconnects: 8
  exclusive_lock_required: true
  unknown_port_owner_action: fail_closed
