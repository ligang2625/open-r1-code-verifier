[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-r1-code-verifier"
version = "0.1.0"
description = "Hidden-test reward experiments built on a pinned Open-R1 checkout."
readme = "README.md"
requires-python = ">=3.10.9"
dependencies = [
    "open-r1==0.1.0.dev0",
    "PyYAML==6.0.2",
    "datasets==3.2.0",
]

[project.optional-dependencies]
dev = ["mypy==1.15.0", "pytest==8.3.5", "ruff==0.9.10", "types-PyYAML==6.0.12.20241230"]

[project.scripts]
code-verifier = "code_verifier.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# uv installs this project and the pinned local Open-R1 source in editable mode.
[tool.uv.sources]
open-r1 = { path = "third_party/open-r1", editable = true }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "piston: requires an explicitly enabled self-hosted loopback Piston service",
    "gpu: requires a CUDA-capable GPU; auto-skipped with an explicit reason on CPU-only machines",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
